name: anchorfish-backend
services:
  database:
    image: ghcr.io/theflyingrat/model-backend-db:latest
    build:
      context: .
      dockerfile_inline: |
        FROM postgres:18-alpine
        COPY database/schema.sql /docker-entrypoint-initdb.d/schema.sql
    restart: unless-stopped
    environment:
      POSTGRES_USER: anchorfish
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: anchorfish
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U anchorfish -d anchorfish"]
      interval: 2s
      retries: 15

  af-backend:
    image: ghcr.io/theflyingrat/model-backend:latest
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.14-slim
        WORKDIR /app
        COPY requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt
        COPY app ./app
        COPY features ./features
        COPY models ./models
        COPY scripts ./scripts
        RUN touch .env
        CMD python -m scripts.seed && exec uvicorn app.main:app --host 0.0.0.0 --port 6345 --proxy-headers --forwarded-allow-ips '*'
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://anchorfish:${POSTGRES_PASSWORD}@database:5432/anchorfish
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env, at least 32 characters}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD in .env}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:?set SEED_USER_PASSWORD in .env}
    depends_on:
      database:
        condition: service_healthy
    networks: [default, anchorfish]

networks:
  anchorfish:
    name: anchorfish

volumes:
  database:
